name: Reproducible release

# Builds the release tarball (contrib/release) twice, on separate runners and
# without a shared cache, and fails unless both builds are byte-identical.
on:
  push:
    tags: ["v*"]
    paths: [contrib/release/**, mix.exs, mix.lock, Makefile, rel/**]
    branches: [master]
  pull_request:
    paths: [contrib/release/**, mix.exs, mix.lock, Makefile, rel/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.run }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: contrib/release/build.sh --progress=plain
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.run }}
          path: dist/

  compare:
    name: Compare
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - name: Both builds are identical
        run: |
          cat release-a/SHA256SUMS release-b/SHA256SUMS
          cmp release-a/SHA256SUMS release-b/SHA256SUMS
